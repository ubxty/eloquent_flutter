name: eloquent_flutter
description: >
  Laravel Eloquent-style ORM for Flutter and Dart on top of Drift:
  chainable queries, casts, soft deletes, dirty tracking, relationships,
  eager loading, observers, pagination, and a schema DSL.
version: 0.1.1
homepage: https://github.com/ubxty/eloquent_flutter
repository: https://github.com/ubxty/eloquent_flutter

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  drift: ^2.18.0
  meta: ^1.15.0

dev_dependencies:
  drift_dev: ^2.18.0
  build_runner: ^2.4.13
  sqlite3: ^2.0.0
  test: ^1.24.0
  lints: ^3.0.0